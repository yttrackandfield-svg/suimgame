<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <!--
      スマホ実機で遊ぶための指定。
        user-scalable=no / maximum-scale=1  … ブラウザ側のピンチ拡大を止める。
          これが無いと、ゲーム内の2本指ピンチ（カメラのズーム）を奪われてしまう。
        viewport-fit=cover                  … ノッチのある端末でも画面いっぱいに広げる。
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d1b2a" />
    <!-- ホーム画面に追加したときに、URLバーの無い全画面で起動する -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="マイスイミングクラブ" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>マイスイミングクラブ</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0d1b2a;
        overflow: hidden;
        /* 引っぱって更新・端のスワイプ戻りを止める（ドラッグ操作と喧嘩するため） */
        overscroll-behavior: none;
      }
      body {
        /* URLバーの出入りで高さが変わる端末では dvh のほうが安定する */
        height: 100dvh;
        /* 画面をなぞる操作はすべてゲームが受け取る（スクロール・ダブルタップ拡大を止める） */
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      /*
        キャンバス自体は滑らかに引き伸ばす。
        ここを pixelated にすると、論理540pxを2.2倍などの半端な倍率へ拡大したときに
        ドットの大きさが不揃いになり、文字がいちばん潰れて読めなくなる。
        ドット絵のくっきり感は、スプライト側のテクスチャを NEAREST にして保っている。
      */
      canvas {
        touch-action: none;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
